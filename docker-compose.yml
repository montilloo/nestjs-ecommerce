services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-ecommerce
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_DATABASE: nestjs_ecommerce
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    container_name: nestjs-ecommerce-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: nestjs_ecommerce
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
